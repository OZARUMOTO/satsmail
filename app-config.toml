# Foundation application configuration
app-name = "satsmail"
friendly-app-name = "Sats Mail"
launcher-app-name = "Sats Mail"
description = "A retro 2009 email client that happens to be a Bitcoin wallet — taproot only (BIP-86)"
icon = "resources/icon.svg"
theme = "resources/theme.json"
app-id = "0x534154534d41494c0000000000000000"
version = "0.3.15"
min-keyos-version = "1.0.0"
signing-identity = "OZARUMOTO"

[publisher]
name = "OZARUMOTO"
contact-email = "mikegotbtc@ozarumoto.dev"
support-url = "https://github.com/OZARUMOTO"

[permissions]
template = ["gui-app", "fs-generic"]
# GetAppSeed (NOT GetSeed): the master seed is ungrouped -> Foundation-only,
# so a sideloaded app can never read it. GetAppSeed carries
# `device-secrets.app-scoped-seed` (grantOnFirstUse) and derives a
# deterministic per-app seed — the wallet below it is satsmail's own
# (BIP-84 account 0 from the app seed), distinct from the built-in wallet.
# Approve the grantOnFirstUse prompt on first launch (or pre-allow under
# Settings -> Apps -> Sats Mail).
"os/security" = ["GetAppSeed"]
# Airlock access: lets the Compose page's "export xpub" save the account
# xpub to the virtual USB share (Settings -> Apps -> Sats Mail -> Permissions
# -> file-system.airlock-files, grantOnFirstUse). BOTH messages are needed:
# OpenFlags::CREATE sets read+write, so open_file() sends GetAirlockReadAccess
# AND GetAirlockWriteAccess — if either is missing from the manifest the
# kernel denies it and the export fails with AccessDenied even when the
# toggle is on.
"os/fs" = ["GetAirlockReadAccess", "GetAirlockWriteAccess"]
"os/settings" = ["GetDeviceName", "GetLocale", "GetPrimeColor"]
"os/gui-server" = ["GetPendingNavRequest", "SwitchToLauncher"]
